<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title data-i18n="workspace.title">项目工作台</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/tailwindcss-cdn.js?v=2026.10.08.1.1792186296"></script>
    <script src="/static/vendor/js/lucide.js?v=2026.10.08.1.1792186296"></script>
    <script src="/static/js/theme.js?v=2026.10.08.1.1792186296"></script>
    <script src="/static/js/touch-mouse.js?v=2026.10.08.1.1792186296"></script>
    <script src="/static/js/i18n.js?v=2026.10.08.1.1792519032"></script>
    <link rel="stylesheet" href="/static/css/canvas-list.css?v=2026.10.21.4">
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.10.08.1.1792186296">
</head>
<body>
    <div id="workspace" class="workspace" style="visibility:hidden" aria-busy="true">
        <!-- LEFT: project sidebar -->
        <aside id="sidebar" class="ws-sidebar">
            <div class="ws-side-head">
                <div class="ws-side-title" data-i18n="workspace.projects">项目</div>
                <button id="newProjectBtn" class="ws-side-add" type="button" data-i18n-title="workspace.newProject" title="新建项目" aria-label="新建项目">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                </button>
            </div>
            <div id="newProjectRow" class="ws-newproj-row">
                <input id="newProjectInput" class="ws-newproj-input" type="text" maxlength="60" data-i18n-placeholder="workspace.projectName" placeholder="项目名称">
                <button id="newProjectConfirm" class="ws-mini-btn primary" type="button" data-i18n-title="common.confirm" title="确定" aria-label="确定"><i data-lucide="check" class="w-3.5 h-3.5"></i></button>
                <button id="newProjectCancel" class="ws-mini-btn" type="button" data-i18n-title="common.cancel" title="取消" aria-label="取消"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
            </div>
            <div id="projectList" class="ws-project-list"></div>
            <div class="ws-side-foot">
                <button id="trashEntry" class="ws-trash-entry" type="button">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                    <span class="ws-trash-label" data-i18n="workspace.trash">回收站</span>
                    <span id="trashBadge" class="ws-trash-badge">0</span>
                </button>
            </div>
        </aside>

        <!-- RIGHT: board -->
        <main class="ws-main">
            <section class="ws-selection-panel" aria-label="选择画布">
            <div class="ws-topbar">
                <div class="ws-topbar-left">
                    <div class="ws-selection-title"><h1 data-i18n="canvas.selectCanvas">选择画布</h1><span id="boardCanvasCount" class="ws-board-count">—</span></div>
                    <div class="ws-selection-subtitle"><span id="boardProjectName" data-i18n="workspace.defaultProject">默认项目</span><span> · </span><span id="selectionHint">打开已有画布，或新建一个开始创作。</span></div>
                </div>
                <div class="ws-topbar-right">
                    <button id="pasteCanvasBtn" class="ws-paste-btn" type="button" data-i18n-title="workspace.pasteToProject" title="粘贴到此项目" style="display:none"><i data-lucide="clipboard-paste" class="w-4 h-4"></i><span data-i18n="workspace.pasteToProject">粘贴到此项目</span></button>
                    <button id="boardRefresh" class="ws-icon-btn" type="button" data-i18n-title="workspace.refresh" title="刷新" aria-label="刷新"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
                    <button id="openTrashBtn" class="ws-icon-btn" type="button" data-i18n-title="workspace.trash" title="回收站" aria-label="回收站"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    <button id="newCanvasBtn" class="ws-primary-btn" type="button"><i data-lucide="plus" class="w-4 h-4"></i><span data-i18n="workspace.newCanvas">新建画布</span></button>
                </div>
            </div>

            <!-- Centered six-column canvas selection -->
            <div id="board" class="ws-board">
                <div id="boardWorld" class="ws-board-world"></div>
                <div id="boardLoadError" class="ws-board-empty hidden" role="alert">
                    <div id="boardLoadErrorText" class="ws-board-empty-text">画布列表加载失败，请重试。</div>
                    <button id="boardRetryBtn" class="ws-primary-btn" type="button">重试</button>
                </div>
                <div id="boardEmptyHint" class="ws-board-empty hidden">
                    <div class="ws-board-empty-icon"><i data-lucide="mouse-pointer-click" class="w-7 h-7"></i></div>
                    <div class="ws-board-empty-text" data-i18n="workspace.empty">暂无画布</div>
                    <div class="ws-board-empty-sub" data-i18n="workspace.emptyHint">为当前项目创建第一块画布</div>
                    <div class="ws-board-empty-actions">
                        <button id="emptyCreateCanvasBtn" class="ws-primary-btn" type="button"><i data-lucide="plus" class="w-4 h-4"></i><span data-i18n="workspace.newCanvas">新建画布</span></button>
                    </div>
                </div>
            </div>

            </section>

            <!-- Trash panel (overlay over the board area) -->
            <div id="trashPanel" class="ws-trash-panel">
                <div class="ws-trash-head">
                    <div class="ws-trash-head-title"><i data-lucide="trash-2" class="w-4 h-4"></i><span data-i18n="workspace.trash">回收站</span></div>
                    <button id="trashClose" class="ws-icon-btn" type="button" data-i18n-title="common.close" title="关闭" aria-label="关闭"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
                <div class="ws-trash-note"><i data-lucide="info" class="w-3.5 h-3.5"></i><span data-i18n="workspace.trashNote">回收站中的画布会在 30 天后自动清理。</span></div>
                <div class="ws-trash-toolbar">
                    <label class="ws-trash-select-all"><input id="trashSelectAll" type="checkbox"><span data-i18n="bulk.selectAll">全选</span></label>
                    <button id="trashRestoreSelected" class="ws-trash-restore-selected" type="button" disabled><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i><span id="trashRestoreSelectedLabel">恢复所选 (0)</span></button>
                </div>
                <div id="trashList" class="ws-trash-list"></div>
            </div>

            <div id="boardStatus" class="ws-status"></div>
        </main>
    </div>
    <script src="/static/js/canvas-list-export.js?v=2026.10.08.1.1792186296"></script>
    <script src="/static/js/canvas-list.js?v=2026.10.21.4"></script>
</body>
</html>
