name: Core regression checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-core:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Run backend, page logic, syntax and translation checks
        run: python tools/check-core.py
      - name: Check public release contents without publishing
        run: python tools/prepare-release.py --preflight
      - name: Check whitespace errors
        run: git diff --check
