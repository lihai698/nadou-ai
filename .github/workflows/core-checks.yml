name: Core regression checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      checked_sha:
        description: Commit checked by the complete core suite
        value: ${{ jobs.windows-core.outputs.checked_sha }}

permissions:
  contents: read

concurrency:
  group: core-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-core:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      checked_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify checked commit
        id: revision
        shell: pwsh
        run: |
          $expected = git rev-parse "$env:GITHUB_SHA^{commit}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -ne $expected) { throw "Checkout does not match the triggering commit" }
          "sha=$actual" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media test tools
        shell: pwsh
        run: |
          choco install ffmpeg --version=8.0.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Run backend, page logic, syntax and translation checks
        run: python tools/check-core.py
      - name: Check public release contents without publishing
        run: python tools/prepare-release.py --preflight
      - name: Check whitespace errors
        run: git diff --check
